name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runner projects
        run: flutter create --platforms=android,ios --project-name pottery_tracker .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: potterytracker-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
