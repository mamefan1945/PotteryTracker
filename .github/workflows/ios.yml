name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runner projects
        run: flutter create --platforms=android,ios --project-name pottery_tracker .
      - name: Set native app display name
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Pottery Manager'" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Pottery Manager'" ios/Runner/Info.plist
      - name: Add transparent padding to app icon
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --disable-pip-version-check Pillow
          .icon-venv/bin/python tool/pad_app_icon.py --scale 0.91
      - name: Install dependencies
        run: flutter pub get
      - name: Generate platform launcher icons
        run: dart run launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
      - name: Set stable iOS bundle identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          source = project.read_text()
          source, count = re.subn(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;", "PRODUCT_BUNDLE_IDENTIFIER = com.mamefan1945.potterymanager;", source)
          if count < 1:
              raise SystemExit("Could not set the iOS bundle identifier")
          project.write_text(source)
          print(f"Set stable bundle identifier in {count} build configurations")
          PY
      - name: Build unsigned device iOS app
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"
      - name: Package and validate device IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          EXECUTABLE="$APP/Runner"
          test -d "$APP"
          test -f "$EXECUTABLE"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Built executable architectures: $ARCHS"
          case " $ARCHS " in
            *" arm64 "*) ;;
            *) echo "Device arm64 architecture is missing"; exit 1 ;;
          esac
          if [[ "$ARCHS" == *"x86_64"* || "$ARCHS" == *"i386"* ]]; then
            echo "Simulator architecture unexpectedly present in device IPA"
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload pottery-manager-sidestore.ipa
          unzip -l pottery-manager-sidestore.ipa | grep -F 'Payload/Runner.app/Runner'
          test -s pottery-manager-sidestore.ipa
      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: potterytracker-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
      - name: Upload device IPA for SideStore
        uses: actions/upload-artifact@v4
        with:
          name: pottery-manager-ios-sidestore-ipa
          path: build/ios/ipa/pottery-manager-sidestore.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Capture iOS screenshots
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots/ios
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Booted/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          fi
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator runtime was found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          DEVICE_ID="$(flutter devices --machine | python3 -c 'import json,sys; devices=json.load(sys.stdin); matches=[d for d in devices if "ios" in d.get("targetPlatform","").lower() and d.get("emulator",False)]; print(matches[0]["id"] if matches else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "Booted iPhone simulator was not detected by Flutter."
            flutter devices
            exit 1
          fi
          perl -e 'alarm 1200; exec @ARGV' env SCREENSHOT_PLATFORM=ios flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d "$DEVICE_ID"
          test -n "$(find screenshots/ios -name '*.png' -print -quit)"
          cd screenshots
          zip -r ../potterytracker-ios-screenshots.zip ios
      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: potterytracker-ios-screenshots
          path: potterytracker-ios-screenshots.zip
          if-no-files-found: error
