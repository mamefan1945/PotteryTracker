name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new commit supersedes an older Android CI run, including a stuck emulator.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runner projects
        run: flutter create --platforms=android,ios --project-name pottery_tracker .
      - name: Set Android app display name
        run: sed -i 's/android:label="pottery_tracker"/android:label="Pottery Manager"/' android/app/src/main/AndroidManifest.xml
      - name: Add transparent padding to app icon
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --disable-pip-version-check Pillow
          .icon-venv/bin/python tool/pad_app_icon.py --scale 0.91
      - name: Install dependencies
        run: flutter pub get
      - name: Generate platform launcher icons
        run: dart run launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Signing keystore and alias validated."
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 tool/configure_android_signing.py
      - name: Build release APKs (per architecture and universal)
        run: |
          flutter build apk --release --split-per-abi --build-number "${{ github.run_number }}"
          flutter build apk --release --build-number "${{ github.run_number }}"
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: potterytracker-android-release
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  screenshots-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runner projects
        run: flutter create --platforms=android,ios --project-name pottery_tracker .
      - name: Set Android app display name
        run: sed -i 's/android:label="pottery_tracker"/android:label="Pottery Manager"/' android/app/src/main/AndroidManifest.xml
      - name: Add transparent padding to app icon
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --disable-pip-version-check Pillow
          .icon-venv/bin/python tool/pad_app_icon.py --scale 0.91
      - name: Install dependencies
        run: flutter pub get
      - name: Generate platform launcher icons
        run: dart run launcher_icons
      - name: Capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: |
            mkdir -p screenshots/android
            timeout --signal=TERM --kill-after=30s 20m bash -lc 'SCREENSHOT_PLATFORM=android flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554'
            test -n "$(find screenshots/android -name '*.png' -print -quit)"
            cd screenshots
            zip -r ../potterytracker-android-screenshots.zip android
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: potterytracker-android-screenshots
          path: potterytracker-android-screenshots.zip
          if-no-files-found: warn
