name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runner projects
        run: flutter create --platforms=android,ios --project-name pottery_tracker .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            mkdir -p screenshots/android
            SCREENSHOT_PLATFORM=android flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554
            test -n "$(find screenshots/android -name '*.png' -print -quit)"
            cd screenshots
            zip -r ../potterytracker-android-screenshots.zip android
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: potterytracker-android-screenshots
          path: potterytracker-android-screenshots.zip
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: potterytracker-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
