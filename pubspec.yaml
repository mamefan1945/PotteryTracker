name: pottery_tracker
description: Pottery Manager is a cross-platform pottery studio management app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.2
  image_picker: ^1.2.0
  path_provider: ^2.1.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  launcher_icons: ^0.16.0

flutter:
  uses-material-design: true

launcher_icons:
  image_path: assets/branding/app_icon.svg
  android:
    generate: true
  ios:
    generate: true
